<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161B" media="(prefers-color-scheme: dark)">
<title>Tokyo, 9 to 14 Nov</title>
<meta name="description" content="Offline-friendly Tokyo trip plan, 9 to 14 November 2026">
<style>
:root{
 --bg:#F1F3F5;--surface:#FFFFFF;--ink:#16202A;--muted:#5B6875;--rule:#DCE1E6;--plate:#FFFFFF;--plateInk:#16202A;
 --day:#E0B400;--dayInk:#1B1B1B;--done:#2E9E5B;--warn:#B76E00;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161B;--surface:#1A2128;--ink:#E7ECF1;--muted:#9AA7B3;--rule:#2B343D;--plate:#F4F6F8;--plateInk:#16202A;--done:#4CC27F;--warn:#E3A33B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161B;--surface:#1A2128;--ink:#E7ECF1;--muted:#9AA7B3;--rule:#2B343D;--plate:#F4F6F8;--plateInk:#16202A;--done:#4CC27F;--warn:#E3A33B;color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:76px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--day);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header + day strip */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 16px 6px;max-width:560px;margin:0 auto}
.hrow h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.hr{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.lang{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{font-size:12px;font-weight:700;padding:4px 10px;color:var(--muted);min-height:28px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:560px;margin:0 auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:64px;border-radius:12px;padding:6px 10px 7px;background:var(--surface);border:1px solid var(--rule);text-align:left;position:relative}
.chip b{display:block;font-size:15px;line-height:1.1}
.chip span{font-size:12px;color:var(--muted)}
.chip i{position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--c)}
.chip[aria-selected=true]{background:var(--c);border-color:var(--c);color:var(--ci)}
.chip[aria-selected=true] span{color:inherit;opacity:.85}
.chip[aria-selected=true] i{display:none}
.chip .today{font-size:10px;font-weight:700;margin-left:4px}

/* day hero */
.hero{margin:18px 0 10px}
.hero .d{font-size:14px;color:var(--muted)}
.hero h2{font-size:26px;line-height:1.15;margin:2px 0 8px;font-weight:800}
.wx{font-size:14px;color:var(--muted);border-left:4px solid var(--day);padding:2px 0 2px 10px}
.next{margin:14px 0 4px;background:var(--day);color:var(--dayInk);border-radius:16px;padding:12px 14px;display:none}
.next.show{display:block}
.next small{display:block;font-size:12px;opacity:.85}
.next strong{font-size:17px}

/* timeline */
.tl{position:relative;margin:14px 0 8px;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--day);opacity:.35}
.it{position:relative;margin:0 0 10px}
.it .dot{position:absolute;left:-22px;top:14px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--day)}
.it.done .dot{background:var(--done);border-color:var(--done)}
.it.done .dot:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:11px 13px}
.it.now .card{border-color:var(--day);border-width:2px}
.row1{display:flex;gap:10px;align-items:baseline}
.time{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;min-width:48px}
.ttl{font-weight:700;font-size:16px;line-height:1.3}
.note{font-size:14px;color:var(--muted);margin:4px 0 0}
.acts{display:flex;gap:14px;margin-top:8px;font-size:14px}
.acts a,.acts button{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule);text-decoration-thickness:2px}
.it.eat .card{background:transparent;border-style:dashed}
.eattag{font-size:12px;font-weight:700;color:var(--warn)}
.time s.was,.mhead s.was{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.mhead s.was{display:inline;margin-left:6px}
.tline{font-size:13px;padding:2px 12px 4px;font-variant-numeric:tabular-nums}.tline b{font-size:15px}.tline span{color:var(--muted)}.tline small{display:block;font-size:12px;color:var(--muted)}.tline .hrs{margin:0}
.arrline{font-size:13px;color:var(--muted);padding:0 12px 4px}.arrline b,.lh b.arr{color:var(--ink);font-variant-numeric:tabular-nums}
.fxtag{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.shiftbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0 0;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--rule))}
.shiftbar span{font-size:14px}.shiftbar small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.shiftbar button{flex:0 0 auto;border:1px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}

/* signature: station sign plates */
.move{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0;font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.signs{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:6px;padding:8px 10px 10px}
.plate{background:var(--plate);color:var(--plateInk);border:1px solid #C9D0D7;border-radius:6px;text-align:center;padding:6px 4px 0;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:68px}
.plate .j{font-size:19px;font-weight:800;line-height:1.15;word-break:keep-all}
.plate .r{font-size:11px;color:#4A5561;margin:2px 0 8px}
.plate:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--lc)}
.plate.long .j{font-size:14px;word-break:break-all;padding:0 4px}
.arrow{align-self:center;font-size:18px;color:var(--muted)}
.mfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);padding:8px 12px;font-size:14px}
.mfoot .fare{font-variant-numeric:tabular-nums;font-weight:700}
details.steps summary{list-style:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule);text-decoration-thickness:2px}
details.steps summary::-webkit-details-marker{display:none}
details.steps ol{margin:0;padding:0 12px 10px 30px;font-size:14px;color:var(--ink)}
details.steps ol li{margin:4px 0}

.hrs{font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:baseline}
.hrs span{font-weight:700;color:var(--muted);flex:0 0 auto}
.hrs.warn,.hrs.warn span{color:var(--warn);font-weight:600}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 8px}
.ft div{background:color-mix(in srgb,var(--day) 10%,var(--surface));border-radius:8px;padding:5px 9px}
.ft small{display:block;font-size:11px;color:var(--muted)}
.ft b{font-size:16px;font-variant-numeric:tabular-nums}
.tnote{font-size:12px;color:var(--muted);padding:0 12px 8px}
details.todo{margin-top:8px;border-top:1px solid var(--rule);padding-top:6px}
details.todo summary{font-size:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.todo summary::-webkit-details-marker{display:none}
details.todo summary:after{content:"＋";color:var(--muted);font-weight:400}
details.todo[open] summary:after{content:"－"}
details.todo ul{list-style:none;margin:6px 0 2px;padding:0}
details.todo li{font-size:14px;padding:6px 0;border-bottom:1px dashed var(--rule)}
details.todo li:last-child{border-bottom:0}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0 4px}
.fcc{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 12px}
.fcc .pl{font-size:12px;color:var(--muted)}
.fcc .tp{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.fcc .tp small{font-size:15px;font-weight:600;color:var(--muted)}
.fcc .tx{font-size:13px;margin-top:3px}
.fcn{font-size:12px;color:var(--muted);margin:4px 0 0}
.flt{background:var(--surface);border:1px solid var(--rule);border-radius:14px;margin-bottom:10px;overflow:hidden}
.flt .fh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 13px 4px}
.flt .fh b{font-size:16px}
.flt .fh span{font-size:13px;color:var(--muted)}
.leg{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:8px 13px}
.leg .ap{font-size:22px;font-weight:800;line-height:1.1}
.leg .tm{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.leg .tr{font-size:12px;color:var(--muted)}
.leg .r{text-align:right}
.leg .no{font-size:12px;font-weight:700;text-align:center;color:var(--muted)}
.lay{margin:0 13px;padding:7px 10px;border-radius:8px;font-size:13px;background:color-mix(in srgb,#E3A33B 16%,var(--surface))}
.fltf{font-size:12px;color:var(--muted);padding:6px 13px 10px}
.steps2{counter-reset:s;list-style:none;margin:0;padding:4px 0}
.steps2 li{counter-increment:s;position:relative;padding:8px 0 8px 34px;border-bottom:1px solid var(--rule);font-size:14px}
.steps2 li:last-child{border-bottom:0}
.steps2 li:before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.jny .mhead>span:last-child{white-space:nowrap;margin-left:8px}
.jt{font-weight:700;font-size:15px;padding:4px 12px 2px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.jt span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.leg2 .lh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:13px;color:var(--muted)}
.leg2 .signs{padding-top:6px}
.xf{margin:2px 10px 8px;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--day) 12%,var(--surface));border-left:4px solid var(--day)}
.xf .xh{font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.xf .xj{font-weight:800}
.xf .xw{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.xf ol{margin:6px 0 0;padding-left:20px;font-size:13.5px}
.xf li{margin:3px 0}
.jfoot{border-top:1px solid var(--rule);font-weight:700}
details.xtra{background:var(--surface);border:1px solid var(--rule);border-radius:14px;margin:10px 0 0;padding:0 13px}
details.xtra summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;padding:11px 0;display:flex;align-items:center;gap:6px}
details.xtra summary::-webkit-details-marker{display:none}
details.xtra summary:after{content:"＋";margin-left:auto;color:var(--muted);font-weight:400}
details.xtra[open] summary:after{content:"－"}
details.xtra ul{margin:0 0 10px;padding-left:18px;font-size:14px}
details.xtra li{margin:4px 0}
details.xtra.rain summary{color:#2E6FA5}
.cln{font-size:12px;color:var(--muted);font-weight:700;background:var(--bg);border-radius:999px;padding:1px 8px}
details.cl .chk{font-size:14px}
.alert{border-radius:16px;padding:11px 14px;margin:12px 0 0;display:flex;flex-direction:column;gap:1px}
.alert small{font-size:12px;opacity:.85}
.alert strong{font-size:20px;font-variant-numeric:tabular-nums}
.alert span{font-size:14px}
.alert.last{background:#16202A;color:#fff}
.alert.urgent{background:#C62828;color:#fff}
.fcc .tx{font-size:13px;color:var(--muted);margin-top:2px}
.tips{margin:6px 0 16px;padding:0;list-style:none}
.tips li{font-size:14px;background:color-mix(in srgb,var(--day) 14%,var(--surface));border-radius:12px;padding:10px 12px;margin-bottom:8px}

/* eat */
h3.sec{font-size:20px;margin:26px 0 4px;font-weight:800}
.sub{font-size:14px;color:var(--muted);margin:0 0 12px}
.area{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.food{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 13px;margin-bottom:8px}
.food .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.food .nm{font-weight:700;font-size:16px;line-height:1.25}
.food .jpn{font-size:14px;color:var(--muted)}
.food .pr{font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.food .meta{font-size:13px;color:var(--muted);margin-top:2px}
.food .why{font-size:14px;margin:6px 0 0}
.food .acts{margin-top:8px}
.fav{font-size:20px;line-height:1;color:var(--muted)}
.fav[aria-pressed=true]{color:#E0A100}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.filters button{flex:0 0 auto;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.food.nr{border-left:4px solid var(--c)}

/* info */
.blk{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:4px 13px;margin-bottom:12px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.li:last-child{border-bottom:0}
.li .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule);font-size:15px;width:100%;text-align:left}
.chk:last-child{border-bottom:0}
.box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--muted);margin-top:1px;position:relative}
.chk[aria-checked=true] .box{background:var(--done);border-color:var(--done)}
.chk[aria-checked=true] .box:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk[aria-checked=true] span{color:var(--muted);text-decoration:line-through}
.phr{display:block;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--rule)}
.phr:last-child{border-bottom:0}
.phr .e{font-size:13px;color:var(--muted)}
.phr .jj{font-size:18px;font-weight:700}
.legend{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.legend:last-child{border-bottom:0}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;padding:10px 0 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--ink);font-weight:700}

/* overlay: show-to-staff */
.ov{position:fixed;inset:0;z-index:50;background:#FFFFFF;color:#111;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));text-align:center}
.ov.show{display:flex}
.ov .big{font-size:clamp(40px,13vw,88px);font-weight:800;line-height:1.15;word-break:keep-all}
.ov .small{font-size:18px;color:#555;margin-top:14px}
.ov .bar{width:70%;height:10px;border-radius:5px;margin-top:22px}
.ov .close{position:absolute;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);border:2px solid #111;border-radius:999px;padding:10px 26px;font-size:16px;color:#111}
.hide{display:none}
.foot{font-size:12px;color:var(--muted);margin:24px 0 8px}
/* current activity: filled dot that blinks, plus a ring rippling outwards (static halo if Reduce Motion is on) */
.it.now .dot{background:var(--day);border-color:var(--day);box-shadow:0 0 0 4px color-mix(in srgb,var(--day) 35%,transparent)}
.it.now .dot::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--day);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
 .it.now .dot{box-shadow:none;animation:nowBlink 1.4s ease-in-out infinite}
 .it.now .dot::before{animation:nowRing 1.4s ease-out infinite}
 @keyframes nowBlink{0%,100%{background:var(--day)}50%{background:var(--surface)}}
 @keyframes nowRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
}
</style>
</head>
<body>
<header>
 <div class="hrow"><h1 id="h1">Tokyo, 9 to 14 Nov</h1><div class="hr"><span class="clock" id="clock"></span><div class="lang" role="group" aria-label="Language / 语言"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="zh" aria-pressed="false">中文</button></div></div></div>
 <div class="strip" id="strip" role="tablist" aria-label="Days"></div>
</header>

<main class="wrap">
 <section id="v-day"></section>
 <section id="v-eat" class="hide"></section>
 <section id="v-near" class="hide"></section>
 <section id="v-info" class="hide"></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="in">
 <button data-v="day" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span id="nPlan">Plan</span></button>
 <button data-v="eat" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 3v18M17 3c-2 2-3 5-3 8h3v10"/></svg><span id="nEat">Eat</span></button>
 <button data-v="near" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="nNear">Nearby</span></button>
 <button data-v="info" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span id="nInfo">Info</span></button>
</div></nav>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Show to staff">
 <div class="big" id="ovBig"></div><div class="small" id="ovSmall"></div><div class="bar" id="ovBar"></div>
 <button class="close" id="ovClose">Close</button>
</div>

 return {date:g("year")+"-"+g("month")+"-"+g("day"),min:+g("hour")*60+ +g("minute"),hm:g("hour")+":"+g("minute")};

let now=jstNow();

/* ===== Live shift: "I'm here now" moves the rest of the day by how late (or early) you are.
   Fixed-time items (fix:1, and any journey with a highway bus) never move and stop the shift. ===== */
let shifts=store.get("shifts",{}); // {dayId:[{i,delta}]}
const isFixed=it=>!!(it.fix||(it.k==="journey"&&it.legs.some(l=>l.line==="bus")));
const hm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const apos=a=>a.i*10+(a.k||0);
/* Effective start of each item, worked out in order. Before any tap the plan is shown as is.
   After a tap: an item moves by the current delay ("carry"); the item after a journey starts no earlier than that journey's
   expected arrival (from the next timetabled train); fixed items reset the delay. */
function sched(d){
 const L=shifts[d.id]||[], P0=d.items.map(it=>toMin(it.t));
 if(!L.length) return P0;
 let carry=null; const out=[];
 d.items.forEach((it,i)=>{
  const tap=L.find(a=>a.i===i&&!a.k);
  if(isFixed(it)) carry=null; else if(tap) carry=tap.delta;
  if(out[i]===undefined) out[i]=P0[i]+(isFixed(it)||carry===null?0:carry);
  const nx=d.items[i+1];
  if(it.k==="journey"&&nx&&!isFixed(nx)&&!L.some(a=>a.i===i+1&&!a.k)){
   const legTap=L.some(a=>a.i===i&&a.k>0);
   if(carry!==null||legTap){const P=legPlanAt(d,i,out[i]), arr=P[P.length-1].arr;
    out[i+1]=Math.max(arr,P0[i+1]+(legTap?0:(carry||0))); carry=out[i+1]-P0[i+1];}
  }
 });

}
function effMin(d,i){return sched(d)[i]}
/* Expected times for each leg of journey i: you reach the platform ("ready"), the next timetabled train leaves ("dep"), you arrive ("arr").
   Leg 0 is ready at the journey's (shifted) time; later legs at the previous arrival plus the transfer walk, or at the time you tapped "I'm at <station> now". */
function legPlan(d,i){return legPlanAt(d,i,effMin(d,i))}
function legPlanAt(d,i,ready){
 const it=d.items[i], P=[];
 it.legs.forEach((l,k)=>{
  if(k>0){const an=(shifts[d.id]||[]).find(a=>a.i===i&&(a.k||0)===k); ready=an?toMin(l.t)+an.delta:P[k-1].arr+((it.xfer[k-1]&&it.xfer[k-1].w)||3);}
  const ride=minsOf(l.dur);
  if(l.line==="bus"){const dep=toMin(l.t);P.push({ready,dep,arr:dep+ride,kind:"bus",next:[]});return;}

  if(T){const j=T.findIndex(x=>x>=ready);
   if(j>=0){P.push({ready,dep:T[j],arr:T[j]+ride,kind:"tt",next:T.slice(j+1,j+3)});return;}
   P.push({ready,dep:ready,arr:ready+ride,kind:"end",next:[]});return;}
  P.push({ready,dep:ready,arr:ready+ride,kind:"none",next:[]});
 });

/* closing, last order or last entry for stops that can run out of time; keyed by English title */
const CLOSE={"Mandarake Complex":["20:00","c"],"Super Potato":["20:00","c"],"Dinner":["21:00","lo"],"Nakamise Shopping Street":["19:00","c"],"Komagome Myōgi Shrine (妙義神社)":["17:00","c"],"Rikugien Garden (六義園), optional":["16:30","e"],"First Avenue Tokyo Station":["20:30","c"],"Shibuya 109":["21:00","c"],"Pokémon Center Shibuya":["21:00","c"],"Square Enix Cafe & Shop":["22:00","c"]};
function shiftWarn(d,i){

 if(c){const cm=toMin(c[0]), left=cm-e, t=c[0];
  if(left<=0) return I(c[1]==="lo"?"wLoGone":c[1]==="e"?"wEntGone":"wClosed").replace("{t}",t);

}

}

let checks=store.get("checks",{});
const fmtIn=m=>ZH()?(m>=60?`${Math.floor(m/60)}小时${m%60?`${m%60}分钟`:""}`:`${m}分钟`):(m>=60?`${Math.floor(m/60)} h${m%60?` ${m%60} min`:""}`:`${m} min`);

function extrasHtml(d){
 let h="";
 const r=RAIN[d.id];
 if(r){const L=ZH()?r.zh:r.en;h+=`<details class="xtra rain"><summary>☂ ${I("rainPlan")}</summary><ul>${L.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`;}
 const c=CHECK[d.id];
 if(c){const L=ZH()?c.zh:c.en;const n=L.filter((_,i)=>checks[d.id+":"+i]).length;
  h+=`<details class="xtra cl"><summary>✓ ${I(d.id==="mon"?"clMon":"cl")} <span class="cln" id="cln-${d.id}">${n}/${L.length}</span></summary><div>${L.map((x,i)=>`<button class="chk" role="checkbox" aria-checked="${!!checks[d.id+":"+i]}" data-cl="${d.id}:${i}"><span class="box"></span><span>${esc(x)}</span></button>`).join("")}</div></details>`;}
 return h+`<div id="alerts" aria-live="polite"></div>`;

function renderAlerts(){
 const el=document.getElementById("alerts"); if(!el) return;
 const ids=DAYS.map(x=>x.id);
 let h="";
 /* last train: evening of today, or after midnight for the previous day */
 let lhId=null, nm=now.min;
 if(todayId&&now.min>=21*60+30) lhId=todayId;
 else if(now.min<240){const ti=todayId?ids.indexOf(todayId):-1; if(ti>0) lhId=ids[ti-1]; nm=now.min+1440;}
 if(lhId&&(cur===lhId||cur===todayId)&&LASTHOME[lhId]){
  const lh=LASTHOME[lhId];let lt=toMin(lh.t);if(lt<240)lt+=1440;const diff=lt-nm;
  if(diff>-60) h+= diff>0?`<div class="alert last${diff<=30?" urgent":""}"><small>${I("lastHome")} ${esc(ZH()?lh.st[0]:lh.st[1])} ${lh.approx?"≈":""}${lh.t}</small><strong>${I("inT")}${fmtIn(diff)}</strong></div>`:`<div class="alert last urgent"><strong>${I("lastGone")}</strong></div>`;
 }
 el.innerHTML=h;
}

/* Live weather: only where the host allows outside requests (GitHub Pages, Netlify, Cloudflare Pages, Vercel, or the file opened directly). On claude.ai the saved snapshot is used. */
const LIVE_OK=location.protocol==="file:"||/(github\.io|netlify\.app|pages\.dev|vercel\.app)$/.test(location.hostname);
function applyLive(w){
 if(!w||!w.d) return;
 Object.keys(w.d).forEach(id=>{const f=FC[id]; if(!f) return;
  let got=false; w.d[id].forEach((v,i)=>{ if(f.c[i]&&v&&v[0]!=null){f.c[i][1]=Math.round(v[0]);f.c[i][2]=Math.round(v[1]);f.c[i][3]=v[2];got=true;} });
  if(got) f.live=w.t; });
}
async function liveWeather(){
 if(!LIVE_OK||!navigator.onLine) return;
 const q=(lat,lon)=>`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&start_date=2026-11-09&end_date=2026-11-14`;
 try{
  const [a,b]=await Promise.all([fetch(q(35.7167,139.8584)).then(r=>r.json()),fetch(q(35.4106,138.8652)).then(r=>r.json())]);
  if(!a.daily) return;
  const ids=["mon","tue","wed","thu","fri","sat"], out={t:Date.now(),d:{}};
  ids.forEach((id,i)=>{const row=k=>a.daily[k][i];out.d[id]=[[row("temperature_2m_max"),row("temperature_2m_min"),row("precipitation_probability_max")]];
   if(id==="wed"&&b.daily) out.d[id].push([b.daily.temperature_2m_max[i],b.daily.temperature_2m_min[i],b.daily.precipitation_probability_max[i]]);});
  store.set("wx",out); applyLive(out);
  if(!$("#v-day").classList.contains("hide")) renderDay();
 }catch(e){}
}

function show(v){
 ["day","eat","near","info"].forEach(x=>$("#v-"+x).classList.toggle("hide",x!==v));
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
 $("#strip").style.display=v==="day"?"":"none";
}

document.addEventListener("click",e=>{

 if(t.dataset.cl){const k=t.dataset.cl;checks[k]=!checks[k];store.set("checks",checks);t.setAttribute("aria-checked",!!checks[k]);const id=k.split(":")[0];const c=CHECK[id];const L=c?c.en:[];const n=L.filter((_,i)=>checks[id+":"+i]).length;const el=document.getElementById("cln-"+id);if(el)el.textContent=n+"/"+L.length;return}
 if(t.dataset.lang){lang=t.dataset.lang;store.set("lang",lang);applyStatic();renderAll();tick();return}
 if(t.dataset.v){show(t.dataset.v);window.scrollTo({top:0});return}
 if(t.dataset.here!==undefined){const d=DAYS.find(x=>x.id===cur), i=+t.dataset.here, k=+(t.dataset.leg||0), it=d.items[i];
  const delta=now.min-toMin(k?it.legs[k].t:it.t), pos=i*10+k;
  const L=(shifts[d.id]||[]).filter(a=>apos(a)<pos); L.push({i,k,delta:Math.abs(delta)<3?0:delta}); shifts[d.id]=L; store.set("shifts",shifts); shownNi=nowIndex(d); renderDay(); renderAlerts(); return}
 if(t.dataset.reset){delete shifts[t.dataset.reset]; store.set("shifts",shifts); renderDay(); renderAlerts(); return}
 if(t.dataset.done){done[t.dataset.done]=!done[t.dataset.done];store.set("done",done);renderDay();return}
 if(t.dataset.fav){favs[t.dataset.fav]=!favs[t.dataset.fav];store.set("favs",favs);renderDay();renderEat();renderNear();return}
 if(t.dataset.f){eatFilter=t.dataset.f;renderEat();return}
 if(t.dataset.nf){nearFilter=t.dataset.nf;renderNear();return}
 if(t.dataset.bk){booked[t.dataset.bk]=!booked[t.dataset.bk];store.set("booked",booked);renderInfo();return}
 if(t.dataset.jump){document.getElementById("eat-here").scrollIntoView({behavior:"smooth"});return}
 if(t.dataset.show){$("#ovBig").textContent=t.dataset.show;$("#ovSmall").textContent=t.dataset.sub||"";$("#ovBar").style.background=t.dataset.col||"transparent";$("#ov").classList.add("show");$("#ovClose").focus();return}
});

function tick(){now=jstNow();$("#clock").textContent=(lang==="zh"?"东京 ":"Tokyo ")+now.hm+(SIM!==null?(lang==="zh"?"（模拟）":" (sim)"):"");}
if(LIVE_OK)applyLive(store.get("wx",null));applyStatic();tick();renderAll();liveWeather();setInterval(liveWeather,3*3600*1000);

let shownNi=todayId?nowIndex(DAYS.find(x=>x.id===cur)):-1;
setInterval(()=>{const before=now.min;tick();renderAlerts();
 if(todayId&&cur===todayId){const ni=nowIndex(DAYS.find(x=>x.id===cur));if(ni!==shownNi||Math.floor(now.min/5)!==Math.floor(before/5)){shownNi=ni;renderDay()}}},30000);
})();
